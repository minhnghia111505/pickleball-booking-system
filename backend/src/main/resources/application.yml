spring:
  application:
    name: pickleball-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pickleball_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Nghia111505!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: ${JPA_BATCH_SIZE:25}
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: ${JPA_DEFAULT_BATCH_FETCH_SIZE:16}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: true
  pagination:
    default-page-size: ${PAGINATION_DEFAULT_SIZE:10}
    max-page-size: ${PAGINATION_MAX_SIZE:50}
  booking:
    min-duration-minutes: ${BOOKING_MIN_DURATION_MINUTES:60}
    max-advance-days: ${BOOKING_MAX_ADVANCE_DAYS:30}
    opening-time: ${BOOKING_OPENING_TIME:06:00}
    closing-time: ${BOOKING_CLOSING_TIME:22:00}
    require-payment-before-confirm: ${BOOKING_REQUIRE_PAYMENT:false}
  schedule:
    slot-duration-minutes: ${SCHEDULE_SLOT_DURATION_MINUTES:60}
    weekly-days: ${SCHEDULE_WEEKLY_DAYS:7}
  statistics:
    top-limit: ${STATISTICS_TOP_LIMIT:5}
    default-period-days: ${STATISTICS_DEFAULT_PERIOD_DAYS:30}
  openapi:
    title: ${OPENAPI_TITLE:Pickleball Booking API}
    version: ${OPENAPI_VERSION:1.0.0}
    description: ${OPENAPI_DESCRIPTION:REST API for pickleball court booking system}
    contact-name: ${OPENAPI_CONTACT_NAME:Pickleball Team}
    contact-email: ${OPENAPI_CONTACT_EMAIL:support@pickleball.local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

logging:
  level:
    com.pickleball.backend: INFO
