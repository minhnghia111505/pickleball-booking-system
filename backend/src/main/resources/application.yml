spring:
  application:
    name: pickleball-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pickleball_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Nghia111505!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: true
  pagination:
    default-page-size: ${PAGINATION_DEFAULT_SIZE:10}
    max-page-size: ${PAGINATION_MAX_SIZE:50}
  booking:
    min-duration-minutes: ${BOOKING_MIN_DURATION_MINUTES:60}
    max-advance-days: ${BOOKING_MAX_ADVANCE_DAYS:30}
    opening-time: ${BOOKING_OPENING_TIME:06:00}
    closing-time: ${BOOKING_CLOSING_TIME:22:00}
    require-payment-before-confirm: ${BOOKING_REQUIRE_PAYMENT:false}

logging:
  level:
    com.pickleball.backend: INFO
